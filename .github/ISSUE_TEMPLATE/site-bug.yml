name: Site bug
description: The site or the map does not work or display as it should.
labels: [site, bug]
body:
  - type: input
    id: url
    attributes:
      label: Page URL
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Firefox 133 on Windows, Safari on iPhone
