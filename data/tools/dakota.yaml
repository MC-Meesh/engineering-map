    label: 'Dakota about page: initiated 1994, GNU LGPL'
  - url: https://github.com/snl-dakota/dakota/blob/devel/LICENSE
    label: Dakota LICENSE (LGPL 2.1)
  - url: https://dakota.sandia.gov/
    label: official page
  - url: https://snl-dakota.github.io/docs/6.23.0/users/_sources/usingdakota/introduction/couplingtosimulations.rst.txt
    label: 'Dakota docs: coupling Dakota to a simulation'
  - url: https://snl-dakota.github.io/docs/6.23.0/users/usingdakota/reference/environment-results_output-hdf5.html
    label: 'Dakota reference: results_output hdf5'
