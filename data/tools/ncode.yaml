website: https://www.hbkworld.com/en/products/software/durability/designlife-cae-fatigue-analysis
summary: CAE durability and fatigue paired with test data processing.
plain: >-
  Predicts how long parts last under repeated loading, using simulation results together with
  measured test data.
workflow: >-
  An analyst brings stress results from a simulation together with measured loads from testing,
  predicts fatigue life here, and reports which parts need changes to the designers.
notes: >-
  HBK (nCode brand) CAE fatigue tool; v7 was the base for Ansys nCode DesignLife (Ansys 14.0, about
  2011) and v8 shipped in 2012; current line is nCode 2026.0. Also resold via Ansys and the Siemens
  (ex-Altair) partner alliance. First release year unconfirmed; 1990 reflected nCode company-era
  tools.
