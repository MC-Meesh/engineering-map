website: https://camworks.com/
summary: Feature-based CAM integrated in SOLIDWORKS and Solid Edge.
plain: >-
  Machining (CAM) software that turns a 3D part designed in SOLIDWORKS or Solid Edge into
  instructions for CNC (computer-controlled) cutting machines, recognizing features such as holes
  and pockets to decide how to cut them.
workflow: >-
  A machinist opens a part designed in SOLIDWORKS or Solid Edge, lets CAMWorks recognize holes and
  pockets and plan the cuts, and writes G-code, the line-by-line instructions the CNC machine
  follows to cut the part.
