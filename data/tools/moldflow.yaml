website: https://www.autodesk.com/products/moldflow/overview
summary: Plastic injection molding simulation (fill, pack, warp).
plain: >-
  Simulates plastic injection molding (pressing molten plastic into a metal mold): how the plastic
  fills and packs the mold and how the finished part warps as it cools.
workflow: >-
  An engineer brings in the plastic part as STEP, Inventor, CATIA or NX files from 3D design
  programs, simulates filling, packing and warping here, passes results to part designers and mold
  makers, and exports geometry as STEP, IGES or SAT.
native_files:
  - ext: .sdy
    what: 'Moldflow study file'
