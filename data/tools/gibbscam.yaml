summary: Production milling and turning CAM, now under Sandvik.
plain: >-
  Turns 3D part designs into cutting instructions for CNC (computer-controlled) milling machines and
  lathes, aimed at production shops making parts in quantity; now part of Sandvik.
workflow: >-
  A machinist opens the part as a STEP file, plans the milling and turning cuts here, and writes
  G-code (the machine's line-by-line instructions) that the shop's CNC machines run to cut the real
  part.
