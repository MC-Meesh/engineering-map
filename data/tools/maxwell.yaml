website: https://ansys.synopsys.com/products/electronics/ansys-maxwell
summary: Low-frequency electromagnetics for motors, transformers and actuators.
plain: Simulates magnetic and electric fields in motors, transformers and actuators.
workflow: >-
  An engineer brings in a motor, transformer or actuator shape as STEP, Parasolid, CATIA, Creo or NX
  files, simulates its magnetic and electric fields here, and passes losses and performance on to
  heat analysis and back to the designers.
