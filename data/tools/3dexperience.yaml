website: https://www.3ds.com/products/3dexperience
summary: >-
  Dassault's platform for product data, collaboration and apps, on premise or on cloud; the
  continuation of V6 (2008) under the 3DEXPERIENCE name (2012), sold as roles.
plain: >-
  An online and in-house platform from Dassault that holds a company's product data and lets teams
  work together, with Dassault's design, manufacturing and simulation apps running on top of it.
workflow: >-
  Teams sign in to one shared platform where CATIA, SOLIDWORKS and other Dassault apps save their
  designs; the data then flows to ENOVIA, DELMIA and SIMULIA apps running on the same platform for
  change control, manufacturing and simulation.
files_note: 'Has no file type of its own: object data is stored in a database called a collaborative space, and files saved from apps such as SOLIDWORKS are uploaded to a File Collaboration Server.'
confidence: high
as_of: '2026-11-22'
clarifies:
  - text: >-
      3DEXPERIENCE is not cloud-only: it has been sold on premise and on public or private cloud
      since V6R2014; a few features, such as cloud HPC in the All Physics Analyst role, are cloud only.
    url: https://www.3ds.com/newsroom/press-releases/dassault-systemes-announces-general-availability-release-2014x-3dexperience-platforms-premise-and-cloud-portfolio
  - text: >-
      3DEXPERIENCE is not a new code line: Dassault describes R2014x as having the V6 architecture as
      its foundation.
    url: https://www.3ds.com/about/company/history
notes: >-
  The platform's PLM applications have their own record, ENOVIA.
