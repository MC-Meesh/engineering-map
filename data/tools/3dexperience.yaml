id: 3dexperience
type: tool
name: 3DEXPERIENCE platform
category: plm-pdm
vendor: dassault
open_source: false
status: active
first_release: 2012
stages:
  - lifecycle
  - design
integrates_with:
  - solidworks
formats:
  reads:
    - 3dxml
    - catia-v5
  writes:
    - 3dxml
