plain: >-
  Siemens' version of Nastran, a long-standing program that calculates how structures bend and
  vibrate under loads; it split from MSC Nastran in 2003.
workflow: >-
  An analyst sets up the model in Simcenter 3D or Femap, which writes a Nastran input file (BDF); it
  is solved here, and the OP2 results file goes back to the same program for review.
