summary: Automatic tetrahedral mesher, also used inside SALOME and FreeCAD.
plain: >-
  Free software that automatically fills a 3D shape with small four-sided cells (tetrahedra) for
  simulation; also used inside SALOME and FreeCAD.
workflow: >-
  A user brings in STEP or STL geometry, Netgen fills it with tetrahedra, and this mesh (the shape
  split into small cells) goes to simulation programs, often through SALOME, FreeCAD or NGSolve.
