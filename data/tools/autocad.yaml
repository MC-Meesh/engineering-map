summary: The canonical 2D drafting and 3D CAD program, and the source of DWG.
plain: >-
  The classic program for making technical drawings on a computer, in 2D and 3D. Its DWG file is a
  common way drawings are exchanged.
workflow: >-
  A drafter creates or edits 2D and 3D drawings here, often from DWG files sent by others, and
  passes DWG or DXF files on to fabricators, machining (CAM) software and other design (CAD)
  programs.
