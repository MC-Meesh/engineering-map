    - nastran-bdf
website: https://www.siemens.com/en-us/products/simcenter/fluids-thermal-simulation/flightstream/
summary: >-
  Vorticity-based panel method for fast aerodynamic and hydrodynamic loads on surface meshes, aimed
  at aircraft, rotors and marine propellers (formerly Altair FlightStream).
plain: >-
  Quickly estimates air and water forces on aircraft, rotors and marine propellers using a fast
  method that works on the surface shape only.
workflow: >-
  An engineer brings in the aircraft, rotor or propeller surface as Parasolid or IGES, estimates the
  air or water forces here in minutes, and exports the loads as a Nastran file for strength checks,
  or the surface as STL or OBJ for more detailed flow tools.
confidence: high
