summary: Open-source CFD from Stanford, known for its adjoint solvers for shape optimization.
plain: >-
  Free software from Stanford for simulating fluid flow, known for efficiently working out how to
  change a shape to improve it.
workflow: >-
  A researcher brings in a CGNS mesh (the flow space split into small cells), runs the flow
  simulation and the shape-improvement (adjoint) calculation here, and writes VTK or Tecplot files
  to view in ParaView or Tecplot.
