summary: Multibody simulation strong in rail, wind turbines and drivetrains.
plain: >-
  Simulates how connected moving parts behave, especially in trains, wind turbines and drivetrains.
workflow: >-
  An engineer builds a multibody model of a train, wind turbine or drivetrain, simulates its motion
  here, exchanges FMUs (packaged models) with control models, and passes loads to strength and
  fatigue tools such as fe-safe.
notes: >-
  1993 is the founding year of INTEC GmbH (later SIMPACK), a DLR spin-off, not a documented first
  release.
