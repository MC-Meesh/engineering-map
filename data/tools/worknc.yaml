summary: Automatic surface machining CAM for molds.
plain: >-
  Automatically plans the cutting paths for CNC (computer-controlled) milling machines that carve
  the curved surfaces of molds.
workflow: >-
  A CNC programmer brings in the mold surface as STL, lets WORKNC work out the cutting paths
  automatically, and writes G-code, the line-by-line machine instructions, for the milling machine.
