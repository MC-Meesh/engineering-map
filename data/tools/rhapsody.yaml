summary: SysML and UML modeling with code generation for embedded systems.
plain: >-
  IBM software for drawing models of a system and its software in the SysML and UML modeling
  languages, then turning those models into program code for embedded devices (computers built into
  products).
workflow: >-
  Engineers model the system and its software in SysML or UML here, generate code for the embedded
  devices from the model, and pass the code to the software build and test teams.
