summary: >-
  Timing constraint tools from the Excellicon acquisition: build, certify and manage SDC
  constraints, analyze clocks and plan early floorplans.
plain: >-
  Tools for writing and checking the timing rules a chip design must meet, analyzing its clocks and
  planning an early layout.
workflow: >-
  A chip team writes the timing rules (SDC files saying how fast each signal must arrive) and an
  early floor plan of where blocks sit on the chip here, then hands them to the tools that build and
  wire the layout and to the final timing checks, which must meet them.
