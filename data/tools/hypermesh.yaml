id: hypermesh
type: tool
name: Simcenter Hypermesh
category: meshing
vendor: altair
open_source: false
status: active
first_release: 1990
stages:
  - analysis
formats:
  reads:
    - nastran-bdf
    - abaqus-inp
    - lsdyna-k
    - ansys-cdb
    - step
    - iges
    - catia-v5
    - parasolid-xt
  writes:
    - nastran-bdf
    - abaqus-inp
    - lsdyna-k
    - ansys-cdb
competes_with:
  - ansa
  - femap
aka:
  - Altair HyperMesh
  - HyperMesh
website: https://www.siemens.com/en-us/products/simcenter/simulation-modeling-visualization/hypermesh/
summary: >-
  Long-established FE pre and post-processor (formerly Altair HyperMesh), heavily used in
  automotive.
plain: >-
  Prepares detailed simulation models, by splitting part shapes into a mesh (a grid of many small
  pieces) that strength and crash programs can calculate on, and then shows the results. Heavily
  used in the car industry.
workflow: >-
  An analyst imports the part shapes as STEP, CATIA or Parasolid files, meshes them here, and writes
  input files for Nastran, Abaqus, LS-DYNA or Ansys, which run the calculation; the results then
  come back here for review.
native_files:
  - ext: .hm
    what: HyperMesh model file
notes: >-
  HyperMesh has its own native geometry kernel (AFC) and offers a Use Parasolid option in some
  topology tools.
confidence: high
as_of: '2026-11-22'
