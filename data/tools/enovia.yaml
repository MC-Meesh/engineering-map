summary: Dassault's PLM applications for product data, change and configuration management, delivered on the 3DEXPERIENCE platform.
plain: >-
  Dassault's software for keeping a company's product data in order, including design changes and
  product versions, on the 3DEXPERIENCE platform.
workflow: >-
  Designers save CATIA and SOLIDWORKS data to the 3DEXPERIENCE platform, where ENOVIA manages its
  versions, changes and product configurations, and released data goes on to manufacturing and the
  rest of the company.
files_note: 'Has no file type of its own: it works on the 3DEXPERIENCE database (a collaborative space) of objects, while files saved from apps such as SOLIDWORKS go to a File Collaboration Server.'
confidence: medium
as_of: '2026-11-22'
notes: Split from the former "3DEXPERIENCE (ENOVIA)" record (decision 0010). The vendor page says ENOVIA is powered by the 3DEXPERIENCE platform.
