summary: Nonlinear structural and fluid-structure FEA from MIT roots.
plain: >-
  Software with roots at MIT that simulates how structures bend and deform under heavy loads, and
  how a structure and the fluid around it push on each other, to check that a design will hold up.
workflow: >-
  An analyst brings in a structure already split into small elements (a mesh), adds the surrounding
  fluid when needed, runs the heavy-load or fluid-structure simulation here, and gives the stresses
  and deformations to the design team to confirm or change the design.
notes: 1975 first release (K.J. Bathe, MIT) not confirmed from a primary source today.
