website: https://www.code-saturne.org/
summary: EDF's finite-volume CFD, open-sourced in 2007.
plain: Free software from the French utility EDF that simulates how air and liquids flow.
workflow: >-
  An analyst prepares a MED or CGNS mesh (the flow region split into small cells), often in SALOME,
  runs the flow simulation here, and views the results in SALOME or exports EnSight Gold files that
  ParaView turns into plots and pictures.
notes: >-
  1997 is when development started at EDF R&D. First open-source (GPL) release was a 1.3 beta in
  March 2007.
