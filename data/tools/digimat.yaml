website: https://www.cadence.com/en_US/home/tools/msc-software/digimat.html
summary: Multiscale material modeling for composites and reinforced plastics.
plain: >-
  Predicts how composite and reinforced plastic materials behave by modeling what happens inside
  them at small scales.
workflow: >-
  A materials engineer describes a composite or filled plastic, Digimat predicts how it behaves, and
  that material model is used inside structural simulation programs such as Abaqus, Ansys Mechanical
  and LS-DYNA.
notes: >-
  2003 is the founding year of e-Xstream engineering (Louvain spin-off); the first Digimat release
  year is not confirmed.
