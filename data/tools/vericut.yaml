summary: Simulates G-code against a machine model to catch collisions and gouges before cutting metal.
plain: >-
  Simulates the G-code instructions a CNC (computer-controlled) machine will follow against a model
  of the machine, to catch collisions and bad cuts before cutting metal.
workflow: >-
  A machining program arrives as G-code from machining (CAM) software such as Mastercam, with the
  stock and part as STEP or STL; VERICUT simulates it on a machine model and, once clean, the
  program goes to the real machine.
