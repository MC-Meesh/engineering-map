summary: >-
  Commercial line of the NASA-funded Nastran code; linear statics, dynamics and aeroelasticity, long
  dominant in aerospace.
plain: >-
  Calculates how structures such as aircraft respond to loads, vibration and airflow; long the
  dominant tool of its kind in aerospace.
workflow: >-
  An analyst builds the model in a preparation tool such as Patran, Femap or HyperMesh and saves it
  as a Nastran input file (BDF); Nastran runs the calculation and writes OP2 result files that
  stress engineers load back for review.
notes: MSC Software was sold by Hexagon to Cadence (closed 2026-02-23).
