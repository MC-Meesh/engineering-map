website: https://www.siemens.com/tia-portal
summary: Engineering framework for Siemens SIMATIC PLCs, HMIs and drives.
plain: >-
  Siemens software for programming SIMATIC PLCs (the small industrial computers that run machines),
  their operator touch screens and the motor drives.
workflow: >-
  An automation engineer programs SIMATIC controllers, operator screens and drives here, then
  downloads the programs to the machine's hardware and tests them on site.
