website: https://www.wolfram.com/system-modeler/
summary: Modelica modeling tied to the Wolfram Language.
plain: >-
  Software for building and simulating models of whole systems, such as machines and circuits, in
  Modelica (an open language for describing systems), with analysis in the Wolfram Language.
workflow: >-
  An engineer builds a Modelica system model here, simulates it, analyzes the results in the Wolfram
  Language, and exchanges FMUs (packaged models) or Modelica files with other system tools.
