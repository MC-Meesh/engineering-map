website: https://openfoam.org/
wikipedia: https://en.wikipedia.org/wiki/OpenFOAM
summary: The Foundation line of OpenFOAM; the dominant open-source CFD toolbox.
plain: >-
  Free software for simulating how air, water and other fluids flow, with each job set up as a
  folder of text files; this is the OpenFOAM Foundation's version, the most used free tool of its
  kind.
workflow: >-
  A user brings in STL surfaces or a mesh (the flow space split into small cells) from Gmsh, Fluent,
  ANSA or Pointwise, runs the flow case here, and writes VTK or EnSight files for ParaView; SimScale
  builds on it.
confidence: medium
as_of: '2026-11-21'
notes: The FLOW-3D and CFX comparisons name OpenFOAM without the distribution; recorded on the Foundation line.
