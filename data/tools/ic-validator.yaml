website: https://www.synopsys.com/implementation-and-signoff/physical-verification.html
summary: Physical verification (DRC, LVS).
plain: >-
  Synopsys software that checks a chip layout against the manufacturer's rules and against the
  intended circuit before the chip is made.
workflow: >-
  A finished chip layout arrives as GDSII or OASIS from implementation tools such as Fusion
  Compiler; IC Validator checks it against the factory rules and the circuit, and clean layouts go
  to manufacturing.
