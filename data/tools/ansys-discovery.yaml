id: ansys-discovery
type: tool
name: Ansys Discovery
category: cad
vendor: ansys
open_source: false
status: active
first_release: 2018
stages:
  - design
  - analysis
built_on:
  - parasolid
formats:
  reads:
    - step
    - iges
    - parasolid-xt
  writes:
    - step
    - iges
    - parasolid-xt
website: https://ansys.synopsys.com/products/3d-design/ansys-discovery
summary: Direct modeling with GPU-based live simulation for early design exploration.
plain: >-
  3D design software where you push and pull shapes directly and see quick simulation results update
  live as you change them, for exploring ideas early in a design.
workflow: >-
  A designer opens or sketches geometry, pushes and pulls it while live simulation results update,
  then exports STEP or Parasolid files to detailed CAD or passes promising shapes on to full Ansys
  simulation.
notes: >-
  shares the SpaceClaim modeling engine; the 2025 R1 release notes say the SpaceClaim kernel moved
  from ACIS to Parasolid (2024 R2 was the last ACIS release)
confidence: high
as_of: '2026-11-21'
