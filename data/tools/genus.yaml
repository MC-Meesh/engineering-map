summary: RTL logic synthesis.
plain: >-
  Cadence software that turns a chip design written as code into a network of basic logic gates.
workflow: >-
  A chip designer hands over the design as Verilog code (text that describes the chip's circuits);
  Genus turns it into a gate-level netlist (a list of logic gates and their wires, also in Verilog),
  which goes on to Innovus to be placed and wired into a chip layout.
