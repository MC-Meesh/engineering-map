website: >-
  https://www.cadence.com/en_US/home/resources/datasheets/cadence-marc-advanced-nonlinear-fea-solver-ds.html
wikipedia: https://en.wikipedia.org/wiki/MSC_Marc
summary: Nonlinear FEA for large strain, contact and rubber; one of the first commercial nonlinear codes.
plain: >-
  Simulates parts that stretch a lot, press against each other or are made of rubber; one of the
  first commercial tools for these hard cases.
workflow: >-
  An analyst brings in the shape as STEP, Parasolid, CATIA or NX files, or a ready Nastran or Abaqus
  mesh of small cells, simulates rubber, large stretching or parts pressing together here, and
  reports deformation and stress back to the designers.
native_files:
  - ext: .dat
    what: 'Marc solver input data file'
notes: >-
  Developed by MARC Analysis Research Corp (founded 1971); MSC bought it in 1999. Cadence product
  page URL not confirmed so url points at the Cadence datasheet
confidence: high
