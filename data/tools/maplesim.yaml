website: https://www.maplesoft.com/products/maplesim/
summary: Modelica-based physical modeling with symbolic model reduction.
plain: >-
  Software for modeling machines such as motors and drives from connected building blocks, written
  in the open Modelica modeling language, with math that shrinks the model so it runs faster.
workflow: >-
  An engineer builds a system model from Modelica blocks here, or brings in Modelica files and FMUs
  (packaged models other simulators can run), simplifies it, and exports FMUs or Modelica models to
  control design and other system tools.
