id: gazebo
type: tool
name: Gazebo
category: robotics-controls
vendor: open-robotics
open_source: true
license: Apache-2.0
status: active
first_release: 2002
stages:
  - analysis
  - test
formats:
  reads:
    - sdformat
    - urdf
  writes:
    - sdformat
integrates_with:
  - ros2
competes_with:
  - isaac-sim
  - webots
website: https://gazebosim.org/
wikipedia: https://en.wikipedia.org/wiki/Gazebo_(simulator)
summary: Open robot simulator tightly integrated with ROS.
plain: >-
  A free robot simulator for testing robots in a virtual world before trying them for real, closely
  tied to ROS, the common robot software framework.
workflow: >-
  A robotics developer loads a robot as URDF or SDFormat, tests it in a virtual world connected to
  ROS 2 programs, and then moves the same ROS software onto the real robot.
notes: >-
  Began fall 2002 at USC (Andrew Howard, Nate Koenig). The nonprofit OSRF (Open Robotics) has
  stewarded it since 2012 and kept it when Intrinsic bought the for-profit OSRC arm in Dec 2022.
confidence: high
