website: https://www.siemens.com/en-us/products/pcb/pads/
summary: Mainstream PCB design.
plain: >-
  Siemens software for drawing circuit diagrams and laying out everyday printed circuit boards;
  Siemens now steers new designs to its Xpedition software.
workflow: >-
  A designer draws and lays out a mainstream board here, and sends Gerber or ODB++ files to the
  board maker; Siemens now points new designs to Xpedition.
notes: >-
  Family: PADS Standard, Standard Plus, Professional and Professional Premium; Siemens now
  recommends Xpedition Standard for new designs. Developed by PADS Software (1986 is its founding
  year), bought by Innoveda in 2000; Mentor got PADS with Innoveda in 2002 (Mentor 10-K FY2002). No
  vendor ids exist for these companies, so origin is unset.
