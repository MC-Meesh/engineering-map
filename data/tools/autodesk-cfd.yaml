summary: Designer-oriented CFD and thermal, formerly CFdesign.
plain: >-
  Simulates air and liquid flow and heat for product designers, for example to see how a device
  stays cool. It was formerly called CFdesign.
workflow: >-
  A product designer brings in the model from Inventor, SOLIDWORKS, Creo, NX, CATIA or a STEP file,
  simulates air or liquid flow and heat here, and takes the results back into the design, for
  example to change vents or fans so a device stays cool.
notes: Blue Ridge Numerics was founded in 1992; the 1993 first release of CFdesign is not confirmed.
