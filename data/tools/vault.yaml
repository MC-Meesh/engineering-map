website: https://www.autodesk.com/products/vault/overview
summary: On-premises PDM for Autodesk design data.
plain: >-
  Keeps Autodesk design files organized on a company's own servers, tracking their versions and
  changes.
workflow: >-
  Designers in Inventor, AutoCAD and Revit check files in and out of Vault on the company's servers,
  which tracks versions and changes, and released files go on to manufacturing.
files_note: 'Has no file type of its own: a SQL Server database tracks file status, history and relationships, while physical files sit in a server file store, all run by ADMS and reached over web services.'
