summary: SPICE-class analog and RF circuit simulator integrated with Virtuoso.
plain: >-
  Cadence software that simulates how analog and radio frequency circuits behave, used together with
  Virtuoso.
workflow: >-
  A circuit designer draws an analog or RF circuit in Virtuoso, which sends it to Spectre as a SPICE
  netlist (a list of parts and connections); the simulation results return to Virtuoso to guide the
  design and layout.
