summary: Tiny parametric CAD with its own NURBS kernel and constraint solver.
plain: A tiny, free 3D design program where dimensions and constraints drive the model.
workflow: >-
  A maker sketches with constraints and builds simple parts here, then exports STEP to other design
  and machining tools, STL for 3D printing, or DXF for 2D work.
notes: >-
  Uses its own geometric constraint solver, tightly coupled to the program and also offered as an
  embeddable library under GPLv3.
