summary: Nonlinear implicit and explicit FEA, widely used for contact, rubber and damage problems.
plain: >-
  Simulates how parts bend, stretch, crack or squash under load, including hard cases like parts
  pressing against each other or rubber deforming, so engineers can check a design will hold up
  before building it.
workflow: >-
  An analyst brings in geometry as STEP, Parasolid or CATIA files, or a ready mesh (the shape split
  into small cells) as an .inp file, runs the nonlinear simulation here, and reads the ODB results
  back in Abaqus/CAE or sends them on to fatigue tools such as fe-safe.
clarifies:
  - text: >-
      Abaqus itself, the desktop product, does not run on 3DEXPERIENCE: it connects to the platform
      through the All Physics Analyst role (a licensed bundle of platform apps), as do CST Studio Suite,
      PowerFLOW, Simpack, Wave6 and XFlow. Separately, Dassault sells simulation roles that live on the
      platform, such as Structural Performance Engineer, which use the same Abaqus solver technology.
    url: https://cloud.academy.3ds.com/explorer/r2026x/role_SXK.html
notes: >-
  Format lists are Abaqus/CAE import and export. Parasolid, CATIA V5, SOLIDWORKS and ANSYS .cdb are
  import only; .inp is written when a job is submitted.
