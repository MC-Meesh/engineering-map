summary: >-
  The most widely licensed commercial B-rep kernel; under Designcenter (formerly NX), Solid Edge, SOLIDWORKS, Onshape and
  many CAE tools.
plain: >-
  The most widely licensed commercial geometry engine for solid 3D shapes; the hidden layer inside
  Designcenter (formerly NX), Solid Edge, SOLIDWORKS, Onshape and many simulation tools.
workflow: >-
  Parasolid runs inside Designcenter (formerly NX), Solid Edge, SOLIDWORKS, Onshape and many simulation tools, doing their
  solid modeling, and its X_T files let those programs pass exact geometry to each other.
notes: >-
  Siemens says Parasolid is licensed to more than 200 independent software vendors and gives model
  compatibility across 350+ applications. Its licensee lists name companies, not products: for CAD,
  Bentley Systems, Fujitsu, IronCAD, Onshape, Shapr3D and Top Systems; for CAM, CNC Software, DP
  Technology, GO2cam, Missler Software, Renishaw, Thermwood and Vero Software; for CAE, Altair,
  ANSYS, COMSOL, MIDAS IT, MSC Software and SimScale; for AEC, Bentley, Midas IT, Nemetschek Allplan
  and Nemetschek Vectorworks; in the cloud, GrabCAD, Onshape, SimScale and Zazzle. Altair
  standardized on Parasolid for data interoperability across its portfolio. Siemens says it builds
  its own products (NX, Solid Edge, Simcenter, Teamcenter, Tecnomatix) with the same components it
  licenses, without saying which product uses which.
confidence: high
