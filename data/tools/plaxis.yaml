id: plaxis
type: tool
name: PLAXIS
category: cae-fea
vendor: bentley
open_source: false
status: active
first_release: 1987
stages:
  - analysis
formats:
  reads:
    - dxf
    - step
  writes:
    - dxf
    - step
    - vtk-xml
website: https://www.bentley.com/software/plaxis-2d/
summary: Geotechnical FEA for soil, tunnels and foundations.
plain: >-
  Simulates soil and how it interacts with tunnels, foundations and other structures in the ground.
workflow: >-
  A geotechnical engineer brings in drawings or geometry as DXF or STEP, models the soil and the
  tunnel or foundation here, simulates how they interact, and passes results as VTK files or reports
  to the structural and civil design team.
