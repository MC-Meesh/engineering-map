summary: The former NEi Nastran, also embedded in Inventor Nastran.
plain: >-
  A program that calculates how parts and structures respond to loads, for example how much a
  bracket bends. It began as NEi Nastran and now mainly ships inside Autodesk Inventor as Inventor
  Nastran.
workflow: >-
  An engineer sets up a model inside Inventor or from a Nastran bulk data file, runs the structural
  solution here, and reviews the results back in the design environment.
notes: >-
  1990 is the reported first commercial PC release of NEi Nastran (Noran Engineering); not confirmed
  from a primary source. The solver now ships mainly as Inventor Nastran.
