website: https://www.ansys.com/products/semiconductors/ansys-redhawk-sc
summary: Power integrity and electromigration signoff for SoCs.
plain: >-
  Checks that power reaches every part of a chip reliably and that its wires will not wear out from
  the current they carry.
workflow: >-
  Once the chip layout is finished, with every part placed and every wire drawn, it comes here for
  power checks; RedHawk-SC finds weak spots in power delivery and wiring, and fixes go back to the
  layout team before the chip is made.
