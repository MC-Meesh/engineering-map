website: https://www.altium.com/altium-designer
wikipedia: https://en.wikipedia.org/wiki/Altium_Designer
summary: Unified schematic and PCB tool popular with professional board designers; tied to Altium 365.
plain: >-
  Software for designing electronic circuit boards in one place, from drawing the circuit diagram to
  placing parts and routing the copper connections, linked to the Altium 365 online service.
workflow: >-
  An engineer draws the circuit and lays out the board here, imports STEP models of parts and
  enclosures, then sends Gerber, drill, ODB++ or IPC-2581 files to the board maker and STEP models
  to the mechanical 3D design (CAD) team.
native_files:
  - ext: .PrjPcb
    what: PCB project file holding project options
  - ext: .SchDoc
    what: Schematic document
  - ext: .PcbDoc
    what: PCB layout document
