plain: >-
  Siemens software components that other programs build in to plan collision-free motion, detect
  collisions, simulate flexible cables and pack parts efficiently.
workflow: >-
  Developers build these components into robot simulation and digital mockup tools; when a planner
  asks for a path, a collision check or a cable shape there, Kineo computes it.
