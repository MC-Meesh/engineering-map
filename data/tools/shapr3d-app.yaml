id: shapr3d-app
type: tool
name: Shapr3D
category: cad
vendor: shapr3d
open_source: false
status: active
first_release: 2016
stages:
  - design
built_on:
  - parasolid
  - d-cubed
  - hoops-exchange
formats:
  reads:
    - step
    - parasolid-xt
  writes:
    - step
    - parasolid-xt
    - stl
