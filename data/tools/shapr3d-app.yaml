website: https://www.shapr3d.com/
wikipedia: https://en.wikipedia.org/wiki/Shapr3D
summary: Direct modeling for iPad, Mac and Windows with pencil-first input.
plain: >-
  3D design software for iPad, Mac and Windows where you shape parts directly, designed for use with
  a pencil.
workflow: >-
  A designer sketches and shapes parts directly with a pencil here, then exports STEP or Parasolid
  to engineering CAD and manufacturing, or STL and OBJ for 3D printing and rendering.
notes: >-
  used Open CASCADE until moving to Parasolid in 2017 Uses the D-Cubed 2D DCM for parametric
  sketching and HOOPS Exchange alongside Parasolid for CAD import and export.
confidence: high
