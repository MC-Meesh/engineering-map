website: https://www.codesys.com/
wikipedia: https://en.wikipedia.org/wiki/CODESYS
summary: Hardware-neutral IEC 61131-3 PLC programming used by many controller makers.
plain: >-
  Software for programming the industrial controllers (PLCs) that run machines and factory
  equipment, using standard IEC 61131-3 languages; many controller makers support it.
workflow: >-
  A controls engineer takes the machine's control logic, writes it here in IEC 61131-3 languages,
  and downloads the program to PLCs from the many controller makers that support CODESYS.
native_files:
