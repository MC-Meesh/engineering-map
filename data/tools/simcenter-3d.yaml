id: simcenter-3d
type: tool
name: Simcenter 3D
category: cae-fea
vendor: siemens
open_source: false
status: active
first_release: 2016
stages:
  - analysis
built_on:
  - nx
  - parasolid
formats:
  reads:
    - nastran-bdf
    - abaqus-inp
    - ansys-cdb
    - lsdyna-k
    - step
    - jt
    - parasolid-xt
  writes:
    - nastran-bdf
    - abaqus-inp
    - ansys-cdb
    - lsdyna-k
integrates_with:
  - simcenter-nastran
competes_with:
  - ansys-mechanical
  - hypermesh
website: https://www.siemens.com/en-us/products/simcenter/mechanical-simulation/simcenter-3d/
summary: >-
  Pre and post-processing on the NX platform for Nastran and third-party solvers, plus acoustics and
  motion.
plain: >-
  Siemens software, built on NX, for preparing simulation models and viewing their results; it sends
  the model to Simcenter Nastran or other calculation programs and also covers noise and motion
  studies.
workflow: >-
  An analyst opens geometry from Designcenter, JT, STEP or Parasolid, splits it into a mesh of small
  elements and sets up the model here, solves with Simcenter Nastran or writes input files for
  Abaqus, Ansys or LS-DYNA, and reviews results here.
native_files:
  - ext: .fem
    what: 'FEM file: mesh, properties and materials'
  - ext: .sim
    what: 'Simulation file: loads, constraints and solutions'
notes: >-
  Introduced with the Simcenter portfolio on 2016-06-14 and shipped with NX 11 in August 2016; it
  succeeded NX CAE and took in LMS Virtual.Lab and LMS Samtech technology.
confidence: high
as_of: '2026-11-22'
