website: https://precice.org/
summary: Open coupling library for partitioned multiphysics, with adapters for many open solvers.
plain: >-
  A free library that connects separate simulation programs so they can solve a combined problem
  together, with ready adapters for many free simulation programs.
workflow: >-
  An analyst runs separate simulation programs such as OpenFOAM, CalculiX, code_aster or SU2 through
  preCICE adapters, which exchange data between them as they run on one coupled problem.
files_note: 'A programming library (C++ with C, Fortran and Python bindings) that solver programs call; data moves at run time over TCP/IP sockets or MPI, set up in an XML file, usually precice-config.xml.'
confidence: medium
