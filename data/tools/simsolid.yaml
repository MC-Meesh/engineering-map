summary: Meshless structural analysis that runs directly on CAD assemblies (formerly Altair SimSolid).
plain: >-
  Calculates stress and bending directly on 3D design models of whole assemblies, skipping the usual
  step of dividing them into a mesh of small elements, so results come quickly.
workflow: >-
  A designer or analyst loads a 3D design assembly as STEP or Parasolid, runs structural analysis
  here without building a mesh, and passes quick results back to the design team.
