summary: Vault-style PDM for SOLIDWORKS files.
plain: Keeps SOLIDWORKS files organized, tracking their versions and who changed them.
workflow: >-
  Designers check SOLIDWORKS files in and out of the PDM vault as they work, which keeps versions
  and history, and released files go on to manufacturing and suppliers.
files_note: 'Has no file type of its own: a SQL Server vault database holds metadata and pointers to files, while the archive server keeps the actual files in a hexadecimal folder structure.'
