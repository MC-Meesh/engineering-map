summary: True 3D injection molding simulation.
plain: >-
  Simulates plastic injection molding (pressing molten plastic into a metal mold) fully in 3D,
  showing how the plastic flows and fills the mold.
workflow: >-
  An engineer brings in the plastic part and mold design as files from 3D design programs, such as
  STEP, Parasolid, CATIA or SOLIDWORKS, simulates the molding here, and passes the filling results
  to the part and mold designers before the mold is cut.
