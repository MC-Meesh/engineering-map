plugin_of: simulink
website: https://www.dspace.com/en/pub/home/products/sw/pcgs/targetli.cfm
summary: Production C code generation from Simulink models.
plain: >-
  Turns control designs drawn in Simulink into the C program code that runs on the small computers
  built into products (embedded controllers).
workflow: >-
  A controls engineer takes a control model from Simulink, generates production C code here for the
  controller's software build, and can export an FMU (a packaged model another simulator can run)
  for testing in system simulation.
