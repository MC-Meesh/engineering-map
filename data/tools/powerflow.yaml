website: https://www.3ds.com/products/simulia/powerflow
summary: Lattice Boltzmann CFD long used for vehicle aerodynamics and aeroacoustics.
plain: >-
  Simulates air flowing around vehicles and the noise it makes, using the lattice Boltzmann method,
  which models the air as particles moving on a grid.
workflow: >-
  An engineer brings in the vehicle surface as STL, simulates airflow and noise here with the
  lattice Boltzmann method, and passes the results back to the vehicle designers.
notes: >-
  1994 is the year Exa first generated commercial revenue (S-1), not a documented PowerFLOW release
  date.
geometry_basis:
  kind: mesh
  text: >-
    Imports CAD geometry, works from a prepared surface mesh model and builds its fluid grid automatically; no geometry kernel is named.
