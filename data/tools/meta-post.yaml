website: https://www.cadence.com/en_US/home/tools/engineering-simulation/meta-postprocessor.html
summary: Post-processor paired with ANSA for crash, NVH and CFD results.
plain: >-
  Shows the results of crash, vibration and fluid flow simulations as pictures, animations and
  plots; used together with ANSA.
workflow: >-
  Solvers write results such as Nastran OP2 or Abaqus ODB files for models built in ANSA; an analyst
  loads them here to make pictures, animations and plots for the vehicle team.
notes: >-
