summary: Building structural analysis and design.
plain: >-
  Software for checking that a building's frame (columns, beams, floors and walls) can safely carry
  its weight, people, wind and earthquakes, and for sizing those parts.
workflow: >-
  A structural engineer brings in the building from the architect's 3D building model as an IFC
  file, checks and sizes the columns, beams and walls here, and sends the sizes and results back to
  the architects and the rest of the project team.
notes: >-
  1975 rests on the ETABS trademark record (Reg. 1449465), which claims first use on 1975-04-30 and
  first use in commerce on 1975-05-30, the same year CSI was founded. No CSI release history page
  confirms it.
