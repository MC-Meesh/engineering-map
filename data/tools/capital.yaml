plain: >-
  Siemens software for designing the electrical and electronic systems of vehicles: the overall
  architecture, the in-vehicle networks and the wiring harnesses routed in 3D.
workflow: >-
  Vehicle engineers define the electrical architecture and networks here, then route the wiring
