summary: One of the most widely installed CAM systems in machine shops.
plain: >-
  One of the most widely installed programs in machine shops for turning 3D part designs into
  cutting instructions for CNC (computer-controlled) milling machines and lathes.
workflow: >-
  A machinist opens the part as STEP, Parasolid, SOLIDWORKS or DXF, plans the cutting paths here,
  and writes G-code (the machine's line-by-line instructions) for the shop's CNC machines; programs
  can be checked in VERICUT first.
