website: https://www.siemens.com/en-us/products/hpcworks/pbs-professional/
summary: HPC workload manager (formerly Altair PBS Professional), with an open-source sibling (OpenPBS).
plain: >-
  Software that shares a high-performance computer cluster among users by queuing and scheduling
  their jobs; an open-source sibling, OpenPBS, also exists.
workflow: >-
  Engineers submit simulation jobs to the cluster; PBS Professional queues and schedules them across
  the machines, and results land back in the users' folders.
files_note: 'Has no file format of its own: it runs jobs from batch scripts submitted with qsub; jobs handle their own files, the server keeps state in a data service and writes daily accounting logs to PBS_HOME.'
notes: >-
  PBS was built for NASA Ames from 1991, so first_release is the NASA PBS date, not the commercial
  PBS Pro. Altair bought the PBS technology (PBS Pro and OpenPBS) from Veridian on 2003-03-10, so
  Altair is not the original developer. The open-source OpenPBS project is still live.
