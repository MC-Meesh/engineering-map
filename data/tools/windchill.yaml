summary: PTC enterprise PLM, tightly paired with Creo.
plain: >-
  PTC's enterprise software for keeping the official record of product designs, parts and changes;
  closely paired with Creo.
workflow: >-
  Engineers check Creo parts, assemblies and drawings into Windchill, which keeps the official
  product record, versions and changes; manufacturing, suppliers and other teams work from the
  released data.
files_note: 'Has no file type of its own: records live in the Windchill database, and content files are stored either in that database or in file vaults on network systems, set by type and life cycle state.'
notes: >-
  PTC dates Windchill to 1998. With Creo connected, designs live in a private workspace on the
  Windchill server instead of a local folder and are shared by checking them in to the commonspace.
  Windchill+, the SaaS edition, became available on 2022-04-19. PTC advertises unified data
  management across Windchill and Onshape.
