summary: Library for physics-informed neural networks and DeepONet.
plain: >-
  A Python library for training neural networks that obey known physical equations, so they can
  solve physics problems.
workflow: >-
  A researcher writes the governing physics equations and any measured data in Python, trains a
  network here to solve them, and uses the trained model as a fast stand-in for a conventional
  simulation program.
files_note: 'A Python programming library for physics-informed neural networks that programs call; Model.save writes weights using the backend''s own save method (for example torch.save) or pickle.'
