  - analysis
formats:
  reads:
    - vtk-xml
competes_with:
  - ncs
  - physicsai
website: https://www.ansys.com/products/simai
summary: Cloud service that trains surrogate models from past simulation results.
plain: A cloud service that learns from past simulation results to predict new ones quickly.
workflow: >-
  An engineer uploads earlier simulation results as VTK files to the cloud, trains a model on them
  here, and uses its quick predictions to compare new designs before running a full simulation.
files_note: 'Cloud platform: solver results must be converted to neutral VTK files before upload; each case is a .vtp surface file plus optional JSON boundary conditions. Outputs can be downloaded.'
confidence: medium
