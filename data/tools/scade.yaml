website: https://www.ansys.com/products/embedded-software/ansys-scade-suite
summary: Qualified model-based code generation for safety-critical embedded software (avionics, rail).
plain: >-
  Turns diagrams of control software into program code for safety-critical computers in aircraft and
  trains, using a code generator qualified (approved) under those industries' safety rules.
workflow: >-
  Engineers model the control software of an aircraft or train here, verify the model, generate
  qualified code for the embedded computer, and can export an FMU (a packaged model another
  simulator runs) to test it in system simulations.
