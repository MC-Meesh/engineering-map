summary: Electrical and wire harness design.
plain: >-
  Software for designing electrical wiring and the cable bundles (harnesses) that connect equipment.
workflow: >-
  An engineer draws the electrical schematics and cable bundles here in an .e3s project, and passes
  DXF or DWG drawings and STEP or JT 3D harness models to harness manufacturing and the mechanical
  design team.
