id: edem
type: tool
name: Simcenter EDEM
category: multiphysics
vendor: altair
origin: dem-solutions
open_source: false
status: active
first_release: 2006
stages:
  - analysis
formats:
  reads:
    - rhino-3dm
    - catia-v5
    - inventor-ipt
    - iges
    - jt
    - obj
    - acis-sat
    - solidworks-native
    - stl
    - step
    - parasolid-xt
    - nx-prt
    - creo-prt
    - hdf5
  writes:
    - hdf5
competes_with:
