website: https://www.siemens.com/en-us/products/simcenter/fluids-thermal-simulation/edem/
summary: Discrete element simulation of bulk materials such as soil, grain and powders.
plain: >-
  Simulates how loose materials such as soil, grain and powders move and pile up, by tracking large
  numbers of individual particles.
workflow: >-
  An engineer brings in the geometry of a machine such as a hopper or mixer as STEP, STL or files
  from 3D design programs, simulates how soil, grain or powder moves through it here, and passes
  forces and flow results to the equipment designers.
native_files:
  - ext: .dem
    what: 'EDEM simulation data file'
  - ext: .dfg
    what: 'EDEM configuration file (Simulator and Analyst settings)'
  - ext: .h5
    what: 'Simulation data stored in HDF5 in a per-simulation folder'
    format: hdf5
confidence: high
