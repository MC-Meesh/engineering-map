summary: Berkeley-era VLSI layout editor with DRC and extraction, revived by open PDKs.
plain: >-
  An old Berkeley program for drawing chip layouts and checking them, which has found new use with
  open chip manufacturing kits.
workflow: >-
  A designer draws or edits a chip layout here, often with an open manufacturing kit, checks the
  spacing rules, extracts a SPICE netlist (a list of the circuit's parts and wires) to simulate, and
  writes GDSII or LEF/DEF files for other open tools and the chip factory.
