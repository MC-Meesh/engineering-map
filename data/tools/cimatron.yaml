summary: CAD/CAM for mold and die makers, now under Sandvik.
plain: >-
  Design and machining software for companies that make molds and dies, from shaping the tool to
  programming the machines that cut it.
workflow: >-
  A mold or die maker brings in the part as STEP or IGES, designs the mold tool here, programs the
  machining, and writes G-code, the step-by-step instructions for the CNC (computer-controlled)
  machines that cut the tool.
