summary: Reference implementation of Fourier neural operators and related architectures.
plain: >-
  A free library of AI models (such as Fourier neural operators) that learn to imitate physics
  simulations, so a trained model can stand in for running the full simulation again.
workflow: >-
  A researcher collects simulation results, trains a neural operator here to learn the physics, and
  uses it as a fast stand-in for running the full simulation program again.
files_note: 'A Python (PyTorch) programming library for neural operators that programs call; save_checkpoint writes a state_dict .pt file plus a metadata file, and the Trainer saves training state to a folder.'
notes: >-
  Public code dates from October 2020; the first tagged library release (0.3.0) came in December
  2023.
