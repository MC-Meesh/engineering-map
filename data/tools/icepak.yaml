id: icepak
type: tool
name: Ansys Icepak
category: cfd
vendor: ansys
open_source: false
status: active
first_release: 1996
stages:
  - analysis
formats:
  writes:
    - step
competes_with:
  - flotherm
website: https://ansys.synopsys.com/products/electronics/ansys-icepak
summary: Electronics thermal management built on the Fluent solver.
plain: >-
  Simulates how electronics such as circuit boards and their boxes heat up and how fans and air cool
  them, using the Fluent flow simulation engine underneath.
workflow: >-
  An electronics engineer brings in the board and its enclosure, simulates the heat and airflow here
  with the Fluent engine, and sends temperatures back to the board and mechanical designers,
  exporting the cooled shape as STEP when needed.
native_files:
  - ext: .tzr
    what: 'Packed (compressed) Icepak project'
confidence: medium
as_of: '2026-11-22'
