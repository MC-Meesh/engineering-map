summary: Static timing signoff.
plain: >-
  Cadence software that checks every signal in a chip design arrives on time at the chip's intended
  speed, the final timing check before the design goes to manufacturing.
workflow: >-
  After placement and wiring of the chip layout, the design comes here for timing checks; fixes go
  back to the layout tools, and a clean result clears the design for tapeout (release to the chip
  factory).
