website: https://kompas.ru/
summary: Russian mechanical CAD built on the C3D kernel.
plain: Russian 3D design software for mechanical parts, built on the C3D geometry engine.
workflow: >-
  A designer models parts and assemblies here on the C3D engine, makes drawings, and exports STEP or
  IGES files to manufacturing and other CAD tools, or STL files for 3D printing.
notes: >-
  C3D Labs, an ASCON subsidiary (per ASCON's KOMPAS-3D page), says KOMPAS-3D has been built on C3D Modeler (the geometry
  kernel), C3D Solver (constraints) and C3D Converter since its first version; the C3D kernel was
  spun out of KOMPAS-3D as a separate product in 2012.
