summary: Cloud PLM and quality for electronics and medical device companies.
plain: >-
  Online software where electronics and medical device companies keep their product records and
  quality records in one shared place.
workflow: >-
  Electronics and medical device teams put parts lists, design files and quality records into Arena
  online, where engineering, suppliers and manufacturing all work from the same released record.
files_note: 'Has no file type of its own: a cloud-native, multi-tenant service holds parts, BOMs, documents and change history, used in the browser and moved through its developer platform and integrations.'
notes: >-
  PTC completed the Arena Solutions acquisition in January 2021 (announced 2020-12-14, about $715M
  cash). first_release 2000 matches the company founding year and is not separately confirmed. Arena
  has an AWS GovCloud edition, connected to Onshape Government on 2025-12-16.
