website: https://ansys.synopsys.com/products/structures/ansys-ls-dyna
wikipedia: https://en.wikipedia.org/wiki/LS-DYNA
summary: Explicit dynamics solver descended from LLNL DYNA3D; widely used for automotive crash.
plain: Simulates very fast events such as car crashes and impacts, showing how structures crumple.
workflow: >-
  An analyst brings in a car or structure already split into small pieces in a preparation tool such
  as ANSA or HyperMesh, saved as an LS-DYNA keyword file (.k), runs the crash or impact here, and
  studies how it crumples in a results viewer such as META.
native_files:
  - ext: .k
    what: Keyword input deck (also .key or .dyn)
    format: lsdyna-k
