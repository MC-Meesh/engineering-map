summary: Low-cost parametric CAD for small shops.
plain: >-
  Affordable 3D design software for small workshops: you draw parts with dimensions that can be
  changed later, and the model updates to match.
workflow: >-
  A small shop models parts and assemblies here, then exports STEP, IGES or SAT files to machining
  (CAM) software and machinists, or STL files to the slicer software that prepares a 3D print.
notes: >-
  The version 28 component list names ACIS R2023, the D-Cubed 2D DCM and 3D DCM, HOOPS Exchange
  2024.3 and HOOPS Visualize 2024.3.
