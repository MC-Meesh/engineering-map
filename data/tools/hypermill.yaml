summary: 5-axis milling CAM, also embedded in SOLIDWORKS and Inventor.
plain: >-
  Writes cutting programs for CNC (computer-controlled) milling machines, including 5-axis machines
  whose cutter can tilt to reach a part from many angles; it also runs inside SOLIDWORKS and
  Inventor.
workflow: >-
  A machine programmer opens the part as STEP or IGES, or works on it inside SOLIDWORKS or Inventor,
  plans the cutting paths here, and writes G-code (the machine's line-by-line instructions) that the
  milling machine runs.
