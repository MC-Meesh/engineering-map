plain: >-
  Keeps track of simulation work, the models, results and the steps used to produce them, so teams
  can find and reuse them.
workflow: >-
  Analysts check simulation models, results and process steps into Minerva as they work, so later
  projects can find, reuse and trust them.
files_note: 'Has no file type of its own: built on Aras, it keeps simulation data in a server database; Workbench projects are saved to and pulled from it over a connection, and HPC job results flow back in.'
