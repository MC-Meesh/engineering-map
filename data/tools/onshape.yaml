summary: Browser-native CAD with built-in version control and data management, from SOLIDWORKS founders.
plain: >-
  3D design software that runs in a web browser, with built-in history of every change and shared
  data, so a team works on the same model.
workflow: >-
  A team designs together in the browser, importing STEP, Parasolid or SOLIDWORKS files, and exports
  STEP or STL files to manufacturing and printing; parts lists can sync to OpenBOM.
files_note: 'Does not use files: work lives in cloud Documents made up of tabs, and every change is saved automatically.'
notes: >-
  Runs on Amazon EC2 compute, and Onshape Government is hosted on AWS GovCloud (U.S.). The
  Onshape-Arena Connection to Arena PLM became available on 2022-09-13.
