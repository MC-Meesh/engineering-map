id: sap2000
type: tool
name: SAP2000
category: cae-fea
vendor: csi
open_source: false
status: active
first_release: 1996
stages:
  - analysis
formats:
  reads:
    - ifc
    - iges
  writes:
    - ifc
    - dxf
competes_with:
  - staad-pro
website: https://www.csiamerica.com/products/sap2000
summary: General structural analysis for bridges and civil structures.
plain: >-
  Software that calculates the forces and movements in bridges and other civil structures, so
  engineers can check they are strong enough.
workflow: >-
  A civil engineer brings in the structure as IFC or IGES from the design model, analyzes the bridge
  or structure here, and sends IFC or DXF back to the design team for the detailed drawings.
native_files:
  - ext: .sdb
    what: 'SAP2000 model database file, binary'
  - ext: .s2k
    what: 'SAP2000 text file with model tables'
notes: >-
  CSI's own Getting Started manual says SAP2000 was first released in 1996 as the first fully
  Windows-integrated SAP; it descends from the 1970s Berkeley SAP codes. CSI was founded in 1975.
confidence: medium
as_of: '2026-11-22'
