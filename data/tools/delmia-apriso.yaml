summary: >-
  Manufacturing operations management from DELMIA: MES functions such as production tracking and
  work instructions, extended to quality, materials and maintenance across plants.
plain: >-
  Software that runs day-to-day manufacturing: tracking production, giving workers instructions and
  managing quality, materials and maintenance across plants.
workflow: >-
  Released product and process data from engineering, on 3DEXPERIENCE for example, reaches the
  plants; Apriso tracks production, guides workers and records quality, materials and maintenance as
  parts are made.
files_note: 'Apriso MES keeps its data in a relational database (SQL Server is a supported provider). Data moves via Business Integrator, web services and Excel mass data tools.'
notes: >-
