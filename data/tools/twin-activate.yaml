website: https://www.siemens.com/en-us/products/simcenter/systems-simulation/twin-activate/
summary: >-
  Block-diagram system and control simulation with native Modelica and FMI import and export, used
  to build and deploy system digital twins (formerly Altair Twin Activate).
plain: >-
  Simulates machines and their control systems by connecting blocks in a diagram, including models
  in the Modelica and FMI exchange standards, to build digital twins (working digital copies) of
  systems.
workflow: >-
  An engineer connects block diagrams, Modelica models and imported FMUs (packaged models), for
  example from RomAI, simulates the system and controls here, and exports FMUs to deploy the system
  digital twin.
