plain: >-
  Free software that simulates how analog and digital electronic circuits behave; it is built into
  KiCad.
workflow: >-
  A designer draws a circuit in KiCad, which sends it to ngspice as a SPICE netlist (a text list of
  parts and how they connect); the simulated voltages and currents come back to the schematic before
  the board is laid out.
