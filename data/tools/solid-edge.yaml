website: https://www.siemens.com/en-us/products/designcenter/solid-edge/
wikipedia: https://en.wikipedia.org/wiki/Solid_Edge
summary: Siemens mid-range CAD with synchronous technology, first released by Intergraph.
plain: >-
  Siemens' mid-range 3D design software, which lets you edit models both through dimensions and by
  moving faces directly.
workflow: >-
  An engineer models parts and assemblies here, manages them in Teamcenter, and exports STEP, JT or
  Parasolid files to suppliers and simulation, or STL and 3MF for 3D printing.
native_files:
  - ext: .par
    what: Solid Edge part document
  - ext: .asm
    what: Solid Edge assembly document
  - ext: .psm
    what: Solid Edge sheet metal document
  - ext: .dft
    what: Solid Edge draft (drawing) document
notes: >-
  Launched by Intergraph on ACIS; moved to Parasolid in 1998 under UGS. Now marketed as Designcenter
  Solid Edge (still commonly Solid Edge); the SaaS tier is Designcenter X Solid Edge. Siemens also
  licenses the full Solid Edge and Simcenter Femap applications to developers as OEM toolkits (Solid
  Edge OEM, Simcenter Femap OEM).
confidence: high
as_of: '2026-11-22'
