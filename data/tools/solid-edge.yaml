id: solid-edge
type: tool
name: Designcenter Solid Edge
category: cad
vendor: siemens
origin: intergraph
open_source: false
status: active
first_release: 1995
stages:
  - design
built_on:
  - parasolid
  - d-cubed
formats:
  reads:
    - step
    - iges
    - parasolid-xt
    - jt
    - dxf
  writes:
    - step
    - iges
    - parasolid-xt
    - jt
