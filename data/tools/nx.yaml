summary: >-
  High-end CAD descended from Unigraphics, formerly NX (renamed Designcenter in June 2026);
  synchronous and parametric modeling on Parasolid.
plain: >-
  Siemens' high-end 3D design software, descended from Unigraphics and formerly called NX; it lets
  you edit models both through dimensions and by moving faces directly.
workflow: >-
  An engineer models parts and assemblies here, manages them in Teamcenter, and shares JT, STEP or
  Parasolid files with simulation in Simcenter 3D, suppliers and viewers; NX CAM programs the
  machining.
native_files:
  - ext: .prt
    what: NX part file
    format: nx-prt
notes: >-
  First sold in 1975 as Unigraphics; EDS merged Unigraphics and I-DEAS into NX in 2002. Sold as
  Designcenter NX from January 2025 and as Designcenter from June 2026. The CAM side keeps the NX
  name (NX for manufacturing, record nx-cam).
