summary: Widely used multibody dynamics code for suspensions, vehicles and mechanisms.
plain: >-
  Simulates how connected moving parts behave together, such as a car suspension, a whole vehicle or
  a mechanism, so engineers can study motion and forces before building a prototype.
workflow: >-
  An engineer builds a model of linked parts, such as a suspension, from the design, runs the motion
  simulation here, and passes loads to strength and fatigue tools, or swaps FMU files (packaged
  models another simulator can run) with control and system tools.
