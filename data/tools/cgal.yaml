summary: >-
  Robust computational geometry (exact predicates, Nef polyhedra, meshing); OpenSCAD's original
  boolean engine.
plain: >-
  A free programming library of reliable geometry math that other software builds in, for example to
  combine solid shapes or build meshes (surfaces made of small triangles). OpenSCAD originally used
  it to combine solids.
workflow: >-
  Developers call CGAL from their own programs, such as OpenSCAD's original solid combiner, to
  combine shapes or build triangle meshes, reading and writing STL, PLY and OBJ files.
notes: >-
  Kernel and support libraries are LGPL, most algorithm packages GPL (since 4.0). Project began in
  1996 as an EU Esprit consortium; CGAL 1.0 shipped April 1998.
