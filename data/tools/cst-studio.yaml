website: https://www.3ds.com/products/simulia/cst-studio-suite
summary: 3D electromagnetic simulation across time and frequency domains.
plain: >-
  Simulates electromagnetic fields in 3D, such as how radio waves and signals behave around and
  inside a design.
workflow: >-
  An engineer brings in the geometry of an antenna, connector or device, simulates its
  electromagnetic fields here, and passes the performance results back to the designers or on to
  circuit and system tools.
notes: >-
  first_release is the lineage start: CST Microwave Studio, the first product, dates from 1998 per
  secondary sources (Physics World); the official page says the products were combined into CST
  Studio Suite in 2006.
