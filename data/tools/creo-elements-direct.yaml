summary: PTC's stand-alone direct-modeling CAD family (Modeling, Drafting, Model Manager), the former CoCreate product line.
plain: >-
  PTC's stand-alone 3D design software where you shape parts directly instead of editing a history
  of features; it came from CoCreate.
notes: >-
  first_release is the lineage start: SolidDesigner (1991), today's Creo Elements/Direct Modeling,
  adopted the ACIS kernel; PTC's Japan blog says the current kernel is K2, PTC's own extension of
  ACIS. It reads and writes Granite .g files for data exchange. The same direct modeling technology
  is in Creo as Flexible Modeling. No English product page was opened, so website points at PTC help.
