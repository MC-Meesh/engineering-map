plain: >-
  AI models and tools that predict simulation results quickly, for engineering in cars, aircraft and
  semiconductors.
workflow: >-
  Engineers train AI models on simulation results for cars, aircraft or chips, then use their quick
  predictions to explore and improve designs before confirming them with full simulation.
files_note: 'Platform that takes in existing CAD geometry and CFD and FEA field data to train its models; it runs hosted, in a customer cloud, on premises or air-gapped.'
notes: >-
  PhysicsX exited stealth in Nov 2023 describing an AI platform; LGM-Aero and Ai.rplane shipped on
  the platform in Dec 2024 and a private Azure Marketplace release followed in May 2025. No dated
  general release found.
