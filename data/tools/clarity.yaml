summary: Massively parallel 3D EM extraction for interconnects.
plain: >-
  Calculates how electrical signals behave in the 3D wiring that connects chips, splitting big
  problems across many processors.
workflow: >-
  A signal integrity engineer brings in the 3D shape of a chip package, connector or board wiring as
  STEP, IGES or SAT, calculates its electrical behavior here, and passes the resulting models to
  circuit and system tools that check signals arrive cleanly.
