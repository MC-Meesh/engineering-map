website: https://www.openbom.com/
summary: Lightweight cloud BOM management connected to many CAD tools.
plain: >-
  Online software for keeping parts lists (bills of materials) up to date, connected to many CAD (3D
  design) programs.
workflow: >-
  Designers in SOLIDWORKS, Onshape or Fusion push their parts lists to OpenBOM online, where
  purchasing and manufacturing teams keep the bill of materials current.
files_note: 'Has no file type of its own: a multi-tenant SaaS platform holds BOMs and items in a graph data model, filled by CAD plug-ins and Excel import and synced to ERP and other systems over REST APIs.'
