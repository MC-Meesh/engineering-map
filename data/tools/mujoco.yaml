summary: Fast contact-rich physics engine, the default for robot learning research.
plain: >-
  A fast physics engine for simulating robots and objects touching and pushing each other; the usual
  choice for robot learning research.
workflow: >-
  A researcher describes the robot and scene in an MJCF file (MuJoCo's own model format) or a URDF
  robot file, simulates contact here, often to train robot control with machine learning, and moves
  the trained controller on to the real robot.
