summary: >-
  DELMIA's manufacturing engineering applications on 3DEXPERIENCE: process planning, robot and
  machining programming and factory simulation.
plain: >-
  Dassault applications for planning how a product will be made: the steps on the factory floor,
  programming robots and machines, and simulating the factory.
workflow: >-
  Manufacturing engineers take the product designed in CATIA on 3DEXPERIENCE, plan the factory
  steps, program robots and machines and simulate the plant here, then release the plans to the shop
  floor.
files_note: 'On 3DEXPERIENCE, DELMIA data lives in the platform repository, not loose files. Data leaves or enters as 3DXML export files or zip exchange packages.'
notes: >-
  DELMIA is a Dassault brand (created 2000) that also covers operations software such as DELMIA
  Apriso, Quintiq, Ortems and DELMIAWorks; this record is the manufacturing engineering part, so it
  is no longer classed as CAM. The brand is brand-delmia.
