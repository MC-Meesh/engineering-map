website: https://pytorch-geometric.readthedocs.io/en/latest/
summary: Graph neural network library widely used for mesh-based simulation surrogates.
plain: >-
  A Python library for neural networks that work on graphs (points joined by links), widely used to
  build fast AI stand-ins for simulations that run on meshes, the grids of small cells.
workflow: >-
  A researcher turns simulation meshes, for example from OBJ or PLY files, into graphs, trains a
  neural network here as a fast stand-in for the full simulation, and uses its predictions in design
  studies.
files_note: 'A Python library built on PyTorch for graph neural networks that programs call; datasets keep raw files and processed graphs saved as .pt files; io helpers read OBJ, PLY, OFF.'
