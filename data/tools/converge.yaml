summary: CFD with automatic runtime meshing, built for engines and moving geometry.
plain: >-
  Simulates fluid flow in engines and other machines with moving parts, building its own grid
  automatically as the parts move.
workflow: >-
  An engineer brings in the engine or machine surface as STL, CONVERGE builds its grid automatically
  while the parts move, and the flow and combustion results are turned into plots and pictures for
  the designers.
