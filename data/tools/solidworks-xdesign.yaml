summary: Browser-based parametric 3D design on the 3DEXPERIENCE platform (3D Creator role), a different application from desktop SOLIDWORKS.
plain: >-
  3D design software that runs in a web browser on Dassault's 3DEXPERIENCE platform, sold as the 3D
  Creator role, with related browser apps for subdivision modeling (xShape), sheet metal and molds.
  A separate program from desktop SOLIDWORKS.
workflow: >-
  A designer signs in to the platform and models parts in the browser; the designs are saved as
  platform objects, not files, next to data from desktop SOLIDWORKS and CATIA.
files_note: 'Keeps its work as objects on the 3DEXPERIENCE platform, not as files of its own.'
confidence: medium
