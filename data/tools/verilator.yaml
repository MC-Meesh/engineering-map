summary: Compiles Verilog to C++ for very fast cycle-based simulation.
plain: >-
  Free software that converts chip designs written in Verilog (code describing a chip's circuits)
  into C++ so they can be simulated very fast.
workflow: >-
  A designer hands over the chip design in Verilog, Verilator turns it into fast C++, and the
  compiled model runs tests whose bugs go back to the designers before the design is turned into
  gates.
