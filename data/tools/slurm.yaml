summary: The most common open-source HPC scheduler.
plain: >-
  The most common free software for sharing a supercomputer among users by queuing and scheduling
  their jobs.
workflow: >-
  Users submit simulation and research jobs to the supercomputer; Slurm queues and schedules them on
  its nodes, and the finished results wait in the users' storage.
files_note: 'Has no file format of its own: it runs jobs from batch scripts submitted with sbatch; jobs read and write their own files on shared storage, and slurmdbd keeps accounting in MySQL or MariaDB.'
