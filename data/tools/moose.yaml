website: https://mooseframework.inl.gov/
summary: Multiphysics object-oriented framework from INL, built for nuclear but general.
plain: >-
  A free framework from Idaho National Laboratory for building simulation codes that combine several
  physical effects; made for nuclear work but usable for others.
workflow: >-
  Developers build a multiphysics app on MOOSE and PETSc, read an Exodus II mesh (the shape split
  into small cells), often from Coreform Cubit, run the coupled simulation, and write Exodus II
  results for ParaView or VisIt.
