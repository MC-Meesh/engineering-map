id: ironcad
type: tool
name: IronCAD
category: cad
vendor: ironcad-co
open_source: false
status: active
first_release: 1998
stages:
  - design
built_on:
  - acis
  - parasolid
  - d-cubed
formats:
  reads:
    - step
    - iges
    - parasolid-xt
    - acis-sat
  writes:
    - step
    - iges
    - parasolid-xt
    - acis-sat
website: https://www.ironcad.com/
summary: Drag-and-drop design tool notable for running two kernels side by side.
plain: >-
  3D design software where you build parts by dragging and dropping shapes, notable for running two
  geometry engines side by side.
workflow: >-
  A designer drags and drops shapes to build parts here, using ACIS or Parasolid geometry, and
  exports STEP, IGES, SAT or Parasolid files to manufacturing and other CAD tools.
native_files:
  - ext: .ics
    what: IronCAD scene file (parts and assemblies)
notes: >-
  Siemens lists IronCAD as a D-Cubed licensee without naming the component.
confidence: medium
as_of: '2026-11-22'
