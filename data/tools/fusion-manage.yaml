summary: >-
  Autodesk cloud PLM, the renamed Fusion Lifecycle (launched as Autodesk PLM 360 in 2012); Upchain
  is offered alongside it.
plain: >-
  Autodesk's online software for managing a product's records and processes, such as design changes,
  formerly called Fusion Lifecycle.
workflow: >-
  Teams working in Fusion and Inventor send parts lists, change requests and project data to Fusion
  Manage online, where change and release processes run before data goes to manufacturing and
  suppliers.
files_note: 'Has no file type of its own: a cloud PLM keeping items in workspaces; files are uploaded as item attachments, versioned by check-in, and shown in an embedded viewer for many 2D and 3D CAD types.'
notes: >-
  Lineage: Autodesk PLM 360 (Feb 2012) became Fusion Lifecycle, then Fusion 360 Manage, then Fusion
  Manage. Upchain (acquired by Autodesk in 2021) is a separate data management product bundled with
  some Fusion Manage offers, not the origin. A Datastay link could not be confirmed.
