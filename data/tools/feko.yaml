website: https://www.siemens.com/en-us/products/simcenter/electromagnetics-simulation/feko/
summary: >-
  High-frequency EM solver built around the method of moments, for antenna placement and scattering
  (formerly Altair Feko).
plain: >-
  Simulates radio waves at high frequencies, for example where best to place an antenna on a
  structure or how an object scatters waves.
workflow: >-
  An engineer brings in the shape of an antenna or the vehicle or aircraft it sits on as STEP, IGES,
  CATIA or Parasolid files, or a ready Nastran or Abaqus mesh of small cells, simulates the radio
  waves here, and reports the best antenna positions to the designers.
native_files:
  - ext: .cfx
    what: 'CADFEKO model file'
  - ext: .fek
    what: 'Feko model (mesh) file'
notes: >-
  Development began in 1991 as Ulrich Jakobus's thesis at the University of Stuttgart; the first
  EMSS version was released at the end of 1996. Wikipedia gives 1997, the commercialization year.
  CADFEKO, the Feko modeller, is based on the Parasolid kernel.
confidence: high
