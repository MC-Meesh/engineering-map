website: https://www.siemens.com/en-us/products/simcenter/mechanical-simulation/inspire/
summary: >-
  Simulation-driven design with topology optimization, formerly Altair Inspire and before that
  solidThinking Inspire.
plain: >-
  Design software where simulation helps choose the shape: you set the loads and it shows where
  material is needed, so parts can be made lighter.
workflow: >-
  A designer brings in a part as STEP or Parasolid, sets the loads it must carry, lets Inspire show
  where material is needed and where it can be removed, rebuilds the lighter shape, and exports STEP
  for other 3D design tools or STL for 3D printing.
notes: first_release 2009 rests on secondary reports of the solidThinking 8.0 era launch
