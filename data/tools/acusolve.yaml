id: acusolve
type: tool
name: Simcenter Acusolve
category: cfd
vendor: altair
open_source: false
status: active
stages:
  - analysis
formats:
  reads:
    - fluent-cas
    - parasolid-xt
    - creo-prt
    - stl
  writes:
    - cgns
    - ensight-gold
website: https://help.altair.com/hwcfdsolvers/acusolve/topics/chapter_heads/whats_new_r.htm
summary: Stabilized finite element CFD solver, often used for thermal and fluid-structure work.
plain: >-
  Simulates how air and liquids flow and how heat moves with them, and can show how a flowing fluid
  and a flexible structure push on each other.
workflow: >-
  An analyst brings in a Fluent case or Parasolid, Creo or STL geometry, sets up the flow in an
  AcuSolve .inp input file and solves it here, then writes CGNS or EnSight Gold result files that
  post-processing tools turn into plots and pictures for the designers.
native_files:
  - ext: .inp
    what: 'AcuSolve input file with all commands for AcuPrep'
notes: >-
  Developed by ACUSIM Software (founded 1994, Mountain View); Altair acquired ACUSIM in January 2011
  after reselling AcuSolve from 2009. Official 2026 name is Simcenter Acusolve (lowercase s). No
  dedicated siemens.com product page exists as of Nov 2026, so the url is the 2026 release notes.
  First release year unconfirmed.
confidence: high
as_of: '2026-11-22'
sources:
