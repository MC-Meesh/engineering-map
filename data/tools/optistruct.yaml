website: https://www.siemens.com/en-us/products/simcenter/mechanical-simulation/optistruct/
summary: >-
  Structural FEA and optimization solver (formerly Altair OptiStruct), an early industrial vehicle
  for topology optimization.
plain: >-
  Calculates how structures respond to loads and can work out where material is needed to make a
  part light but strong.
workflow: >-
  An analyst brings in a Nastran input file (BDF) from a pre-processor such as HyperMesh, solves or
  optimizes the structure here, and writes OP2 result files that HyperView or other viewing tools
  show as stress pictures.
notes: >-
  Altair dates the official launch to 1994; some Altair material gives 1993 for the first commercial
  version
