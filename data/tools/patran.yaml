summary: Long-lived FEA pre/post-processor, especially in aerospace stress groups.
plain: >-
  Long-used software for setting up structural simulation models and viewing their results,
  especially by aerospace stress engineers.
workflow: >-
  A stress engineer builds the model here, writes a Nastran BDF or Abaqus .inp input file for the
  calculation program, and loads the Nastran OP2 results back to check the structure.
notes: >-
  Developed by PDA Engineering (Santa Ana), bought by MSC in Sept 1994; MSC passed to Cadence with
  Hexagon's Design and Engineering business in Feb 2026. 1978 is the first-use date on PDA's PATRAN
  trademark (filed 1979), used as a proxy for first release.
