summary: Enterprise materials data management feeding CAD and CAE.
plain: >-
  Keeps a company's approved material data in one place and feeds it to design and simulation tools,
  so everyone uses the same material properties.
workflow: >-
  Materials experts load test results and approved properties into Granta MI's SQL database; design
  (CAD) and simulation programs then pull the same values through its server, so every model in the
  company uses one agreed set of material data.
files_note: 'Has no file type of its own: materials data lives in Microsoft SQL Server or Azure SQL databases, shipped as SQL backups and reached through the Granta MI server software and its clients.'
notes: >-
  Granta Design, a 1994 Cambridge spin-out (Ashby, Cebon), was acquired by Ansys in early 2019.
  Ansys is now part of Synopsys. The GRANTA MI product launch year was not found.
