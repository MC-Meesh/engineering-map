  - heeds
website: https://www.ansys.com/products/connect/ansys-optislang
summary: Robust design optimization and metamodel-based sensitivity analysis.
plain: >-
  Finds which design inputs matter most and searches for designs that still perform well when
  real-world values vary.
workflow: >-
  An engineer connects optiSLang to simulation models, runs them many times to see which inputs
  matter and which designs are robust, and passes the chosen designs back to the team.
