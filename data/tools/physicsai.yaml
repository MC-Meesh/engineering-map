  - simai
website: https://www.siemens.com/en-us/products/simcenter/engineering-data-science-ai/physicsai/
summary: >-
  Geometric deep learning on prior CAE results, run inside Simcenter Hypermesh, Simlab and Inspire
  (formerly Altair physicsAI).
plain: >-
  Uses AI trained on earlier simulation results to predict new ones quickly, inside Hypermesh,
  Simlab and Inspire.
workflow: >-
  An engineer trains a model inside Hypermesh, Simlab or Inspire on earlier Abaqus ODB or Nastran
  OP2 results, then gets quick predictions for new designs in the same tool before running a full
  simulation.
files_note: 'Runs inside Simcenter HyperMesh, SimLab and Inspire rather than a cloud upload; trains on existing solver result files read through HyperView (e.g. .h3d, .odb, .op2, .d3plot).'
notes: first shipped in HyperWorks 2022.3, released in May 2023
confidence: high
