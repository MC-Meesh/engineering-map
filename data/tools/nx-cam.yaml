website: https://www.siemens.com/en-us/products/nx-manufacturing/
summary: >-
  Siemens part manufacturing software for CNC programming, robot machining, additive and inspection;
  it kept the NX name when the CAD side became Designcenter. The SaaS tier is NX X Manufacturing.
plain: >-
  Siemens software that writes the instructions for CNC (computer-controlled) machine tools,
  machining robots, industrial 3D printers and inspection, for parts designed in Designcenter.
workflow: >-
  A programmer opens the part designed in Designcenter, programs CNC machining, robot machining, 3D
  printing or inspection here, and sends the programs to the shop floor.
confidence: high
