summary: FEA and multibody results post-processing (formerly Altair HyperView).
plain: >-
  Shows the results of strength simulations and of simulations of linked moving parts as colored
  pictures, animations and plots, so engineers can see where a part bends or how a mechanism moves.
workflow: >-
  A strength or motion simulation program such as Nastran writes results, for example as an OP2
  file; an analyst loads them here to make plots and animations for the design review.
