website: https://www.siemens.com/en-us/products/ic/calibre-design/
summary: Widely used DRC and LVS physical verification signoff tool.
plain: >-
  Checks a finished chip layout against the manufacturer's rules and confirms that the layout
  matches the intended circuit, a final check before a chip is made.
workflow: >-
  When the chip layout is finished in a place-and-route or custom layout tool, it arrives here as
  GDSII or OASIS for the final rule and circuit checks; once clean, it goes to the chip factory.
