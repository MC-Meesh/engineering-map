summary: Header-only C++ linear algebra used everywhere from robotics to geometry.
plain: >-
  A free C++ library for the matrix and vector math found in countless programs, from robots to
  geometry tools.
workflow: >-
  Programmers include Eigen in their own code, such as robotics, geometry or simulation programs, so
  those programs can do their matrix and vector math; the results stay inside those programs.
files_note: 'A header-only C++ template library for linear algebra that programs include and compile in; it has no file format of its own, and matrices live in the calling program''s memory.'
notes: >-
  MPL-2.0 since version 3.1.1 (earlier releases LGPL-3.0-or-later). Pure header template library.
  Originated in KDE; first_release 2006 not confirmed from a primary source (oldest GitLab tag is a
  2007 rewrite).
