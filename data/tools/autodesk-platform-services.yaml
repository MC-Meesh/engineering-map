website: https://aps.autodesk.com/
summary: Autodesk's cloud development platform of web service APIs, formerly Forge; Autodesk also uses it to build its own industry clouds.
plain: >-
  Autodesk's set of online programming interfaces for reaching design data in its cloud; outside
  developers and Autodesk's own products build on it.
files_note: 'Works through web APIs, not files: the Data Management API reaches data in Fusion Team, BIM 360 Docs, Forma Data Management and the Object Storage Service.'
notes: >-
  The Forge brand became Autodesk Platform Services in late 2022 (announced at Autodesk University
  2022), with the same APIs and services. Its Manufacturing Data Model API reads and writes Fusion
  design data in the cloud.
confidence: high
