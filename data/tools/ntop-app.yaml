website: https://www.ntop.com/
summary: Implicit modeling for lattices, field-driven geometry and parts that B-rep kernels struggle with.
plain: >-
  Design software for complex shapes such as lattices and geometry that varies across a part, which
  ordinary CAD (3D design) tools struggle to build.
workflow: >-
  An engineer brings in CAD as STEP or Parasolid, builds lattices and shapes that vary across the
  part here, and exports STL or 3MF for 3D printing, or Parasolid back to CAD.
notes: >-
  Core is nTop's own implicit modeling kernel. Reads and writes Parasolid x_t/x_b per nTop support
  docs, but no source shows Parasolid licensed as a kernel. 2016 is the first nTopology product
  (Element); nTop Platform launched July 2019. A new generation of the implicit kernel shipped in
  nTop 5. nTop Core is a developer library that lets partner applications read .implicit files;
  Materialise Magics imports .implicit files and there is an nTop add-in for Autodesk Fusion.
