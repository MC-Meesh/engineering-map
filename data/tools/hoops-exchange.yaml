summary: >-
  SDK that reads most native and neutral CAD formats into one B-rep and tessellation model; embedded
  in many CAE and viewer products.
plain: >-
  A software component that other programs build in to open most 3D design files and turn them into
  one common model; used inside many simulation and viewer products.
workflow: >-
  Developers build HOOPS Exchange into simulation tools and viewers; when a user opens a CATIA,
  SOLIDWORKS, Creo, NX or STEP file there, it reads the file into one model the host program can
  use.
