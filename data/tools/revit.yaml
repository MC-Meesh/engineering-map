id: revit
type: tool
name: Revit
category: cad
vendor: autodesk
origin: revit-technology
open_source: false
status: active
first_release: 2000
stages:
  - design
  - lifecycle
formats:
  reads:
    - ifc
    - dwg
    - dxf
    - acis-sat
  writes:
    - ifc
    - dwg
    - dxf
competes_with:
  - archicad
  - allplan
  - vectorworks
website: https://www.autodesk.com/products/revit/overview
wikipedia: https://en.wikipedia.org/wiki/Autodesk_Revit
summary: Dominant BIM authoring tool for buildings.
plain: >-
  The dominant software for designing buildings as 3D models that carry information about every
  element (known as BIM).
workflow: >-
  An architect or engineer models the building here, shares it as IFC with structural and
  coordination tools and as DWG or DXF with consultants, and keeps files organized in Vault.
native_files:
  - ext: .rvt
    what: Revit project (model) file
  - ext: .rfa
    what: Revit family file
notes: >-
  Imports ACIS solids from SAT files up to SAT version 7.0 only. Came to Autodesk with the April
  2002 purchase of Revit Technology Corporation.
confidence: medium
