competes_with:
  - catia
  - nx
aka:
  - Pro/ENGINEER
website: https://www.ptc.com/en/products/creo
wikipedia: https://en.wikipedia.org/wiki/PTC_Creo
summary: Successor to Pro/ENGINEER, the first commercial parametric feature-based CAD.
plain: >-
  PTC's 3D design software for mechanical parts. Its predecessor, Pro/ENGINEER, was the first
  commercial design tool where changing one dimension updates the whole model.
workflow: >-
  An engineer models parts and assemblies here, saves them to Windchill, and exports STEP, JT or
  IGES files to simulation, suppliers and viewers, or STL files to 3D printing.
native_files:
  - ext: .prt
    what: Creo part
    format: creo-prt
  - ext: .asm
    what: Creo assembly
  - ext: .drw
    what: Creo drawing
notes: >-
  PTC dates the Pro/ENGINEER launch to 1988 and introduced the Creo name in 2010. Creo connects to
  Windchill as a registered server and then saves to and opens from a Windchill workspace, but it
  also works without Windchill, so the two integrate rather than one running on the other.
confidence: medium
as_of: '2026-11-22'
