id: creo
type: tool
name: Creo
category: cad
vendor: ptc
open_source: false
status: active
first_release: 1988
stages:
  - design
  - analysis
  - manufacturing
built_on:
  - granite
formats:
  reads:
    - creo-prt
    - step
    - iges
    - jt
    - parasolid-xt
    - acis-sat
  writes:
    - creo-prt
    - step
