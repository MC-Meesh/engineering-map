      https://ansys.synopsys.com/news-center/press-releases/1-3-23-ansys-acquires-leading-particle-dynamics-simulation-software-rocky
    label: Ansys press release, Rocky acquisition 2023-01-03
  - url: https://ansys.synopsys.com/products/fluids/ansys-rocky
    label: Ansys Rocky product page
