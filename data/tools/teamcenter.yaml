summary: Enterprise PLM; system of record for many automotive and aerospace programs.
plain: >-
  Siemens' enterprise software for keeping the official record of a product's designs, parts and
  changes; many car and aircraft programs rely on it.
workflow: >-
  Designers in Designcenter and Solid Edge check parts and assemblies into Teamcenter, which keeps
  the official record and JT files; manufacturing tools such as Process Simulate and suppliers work
  from released data.
files_note: 'Keeps objects and their properties in a central database; the files themselves move through its File Management System (FMS) and are kept in storage volumes on file servers.'
