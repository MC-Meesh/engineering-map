summary: >-
  Kernel, constraint solver and translators spun out of ASCON; under KOMPAS-3D and several Chinese
  and Russian CAD systems.
plain: >-
  Geometry building blocks that other design programs use inside: they handle the math of solid 3D
  shapes, keep sketch dimensions consistent and convert files. KOMPAS-3D and several other CAD
  systems use them.
workflow: >-
  CAD developers build C3D into programs such as KOMPAS-3D, which call it for solid modeling, sketch
  constraints and translating STEP, IGES, Parasolid and SAT files.
notes: >-
  C3D Toolkit bundles a geometry kernel, a constraint solver, a visualization engine, a
  mesh-to-B-rep converter and a data converter.
