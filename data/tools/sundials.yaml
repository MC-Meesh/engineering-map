summary: Time integrators and nonlinear solvers (CVODE, IDA, KINSOL).
plain: >-
  A free library of methods for stepping equations forward in time and solving nonlinear equations,
  used inside simulation codes.
workflow: >-
  Simulation codes call SUNDIALS to step their equations forward in time and solve nonlinear
  systems; the answers go straight back into the code that called it.
files_note: 'A library of time integrators and nonlinear solvers used from C, C++, Fortran and Python programs; data stays in the caller''s vectors in memory and it defines no file format.'
