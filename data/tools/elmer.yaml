website: https://www.elmerfem.org/
wikipedia: https://en.wikipedia.org/wiki/Elmer_FEM_solver
summary: Open multiphysics FEM covering heat, fluids, structures and electromagnetics.
plain: >-
  Free simulation software that can combine heat, fluid flow, structures and electromagnetics in one
  model.
workflow: >-
  An analyst splits the geometry into a mesh of small cells, often in Gmsh, loads the MSH file here,
  solves the coupled heat, flow, structure or field problem, and writes VTK files for viewing in
  ParaView.
