  Teams manage requirements, tests and work items here in the browser, exchange requirements with
  other tools as ReqIF (a standard requirements exchange file), and track each item through to
  verification.
files_note: Keeps requirements, tests and plans as versioned items in a Subversion repository on its server, not as files you save; it exchanges requirements with other tools as ReqIF.
