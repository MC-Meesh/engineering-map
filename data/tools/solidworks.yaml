summary: The default mid-range parametric CAD for mechanical design, with a large add-in ecosystem.
plain: >-
  The default mid-range 3D design software for mechanical parts and assemblies, where dimensions
  drive the model; many add-ins extend it.
workflow: >-
  An engineer models parts here, with add-ins such as CAMWorks or SolidCAM for machining and
  SOLIDWORKS Simulation, keeps files in SOLIDWORKS PDM, and exports STEP or Parasolid to suppliers,
  or STL and 3MF to printing.
clarifies:
  - text: >-
      SOLIDWORKS reaches 3DEXPERIENCE in two ways, and both are the same Windows desktop program, not
      browser CAD. Route 1: an existing desktop seat adds the Design with SOLIDWORKS add-in (Dassault
      calls this Cloud Services). Route 2: SOLIDWORKS is bought as a 3DEXPERIENCE SOLIDWORKS offer, which
      installs, licenses and updates it from the platform and stores its data there. The browser-based
      design app is a different product, xDesign.
    url: https://www.3ds.com/support/getting-started/solidworks-frequently-asked-questions
notes: >-
  Third-party native files (CATIA V5, NX, Creo, Inventor, JT, Solid Edge) open through 3D
  Interconnect; the CATIA V5 translator needs SOLIDWORKS Design Premium or Ultimate. STL import not
  checked.
