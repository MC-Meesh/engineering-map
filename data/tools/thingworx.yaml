website: https://www.velotic.com/products/thingworx
summary: >-
  Industrial IoT application platform; PTC sold it to TPG in March 2026 and it now belongs to
  Velotic with Kepware and Proficy.
plain: A platform for building applications that connect to and use data from industrial machines.
workflow: >-
  Edge devices and Kepware connections send machine data to ThingWorx; developers build applications
  on it that operators use to monitor and act on the equipment.
files_note: 'Works through connections rather than files: data arrives from edge devices, Kepware industrial connections and the ThingWorx REST API.'
notes: >-
  Windchill Navigate (formerly ThingWorx Navigate), PTC's role-based apps over Windchill data, runs
  on ThingWorx Foundation. The Vuforia Experience Service, which Vuforia Studio and Vuforia View
  need, is an add-on to ThingWorx.
confidence: high
