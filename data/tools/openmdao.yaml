summary: NASA framework for gradient-based multidisciplinary design optimization.
plain: >-
  A free NASA framework for optimizing designs that involve several connected disciplines at once.
workflow: >-
  An engineer links models from several disciplines, such as aerodynamics and structures, into one
  problem here, and the optimizer searches for the best overall design to hand back to the teams.
files_note: 'A Python programming library that programs call to build and solve multidisciplinary models; its case recorder saves run data to a SQLite database file that a CaseReader reads back.'
