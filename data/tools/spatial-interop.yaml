summary: Spatial's CAD translation SDK, paired with ACIS and CGM.
plain: >-
  A software component that other programs build in to convert between the file types of different
  3D design (CAD) programs.
workflow: >-
  Developers build 3D InterOp into their programs; when a user opens a CATIA, SOLIDWORKS, NX, Creo
  or STEP file there, it translates the geometry for the host program's ACIS or CGM model.
