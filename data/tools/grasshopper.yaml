website: https://www.grasshopper3d.com/
wikipedia: https://en.wikipedia.org/wiki/Grasshopper_3D
summary: Visual programming for parametric and computational design inside Rhino.
plain: >-
  Lets designers build shapes inside Rhino by connecting blocks in a visual diagram instead of
  modeling by hand, so changing an input reshapes the design.
workflow: >-
  A designer connects blocks in a visual diagram inside Rhino to generate the shape, adjusts inputs
  to explore options, and bakes the result into Rhino geometry for export or fabrication.
