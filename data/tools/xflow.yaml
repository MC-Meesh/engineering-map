website: https://www.3ds.com/products/simulia/xflow
summary: Particle-based lattice Boltzmann CFD for moving parts and free surfaces.
plain: >-
  Simulates liquids and gases around moving parts and open liquid surfaces that splash and slosh,
  using a particle-based method instead of a fixed grid.
workflow: >-
  An engineer brings in the geometry with its moving parts, simulates the flow and free surfaces
  here with a particle-based method, and passes the results back to the designers.
geometry_basis:
  kind: mesh
  text: >-
    Builds its particle lattice automatically from the input geometry, avoiding classic meshing; no geometry kernel is named.
