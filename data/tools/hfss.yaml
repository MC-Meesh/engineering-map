summary: High-frequency 3D electromagnetic solver for antennas, RF and signal integrity.
plain: >-
  Simulates radio waves and high-frequency signals in 3D, for designing antennas, radio parts and
  fast electrical connections.
workflow: >-
  An engineer brings in the antenna, connector or board shape as STEP, Parasolid, CATIA files or a
  GDSII chip layout, simulates the fields here, and sends performance figures to circuit and board
  designers, exporting the shape as STEP, GDSII or STL when needed.
