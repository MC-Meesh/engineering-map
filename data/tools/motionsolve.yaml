id: motionsolve
type: tool
name: Simcenter Motionsolve
category: cae-fea
vendor: altair
open_source: false
status: active
first_release: 2006
stages:
  - analysis
competes_with:
  - adams
website: https://www.siemens.com/en-us/products/simcenter/mechanical-simulation/motionsolve/
summary: Multibody dynamics solver, sold as Altair MotionSolve until Siemens renamed it in 2026.
plain: >-
  Simulates how the connected moving parts of machines and vehicles move and what forces they feel.
workflow: >-
  An engineer builds a model of linked moving parts from the design, simulates the motion here, and
  passes the loads to structural and fatigue analysis.
native_files:
  - ext: .xml
    what: 'MotionSolve XML model and simulation input file'
  - ext: .mrf
    what: 'MotionSolve results file'
