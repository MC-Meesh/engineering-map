summary: >-
  Distributed workload manager for compute clusters with shared-resource reporting (formerly Altair
  Grid Engine), sold beside PBS Professional under HPCWorks.
plain: >-
  Software that shares a computer cluster among many users by queuing their jobs, and reports who
  used which shared resources.
workflow: >-
  Engineers submit simulation and other compute jobs; Grid Engine queues them, runs them on the
  shared cluster, and reports who used which resources.
files_note: 'Has no file format of its own: it runs job scripts submitted with qsub; jobs handle their own files, the master spools cluster state and logs finished jobs to an accounting file read by qacct.'
notes: vendor altair follows the other renamed Altair products. Lineage before Altair not checked.
