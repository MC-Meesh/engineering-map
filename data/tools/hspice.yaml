plain: >-
  Synopsys software that simulates how an electronic circuit behaves, long used as the reference for
  accurate results.
workflow: >-
  A circuit designer exports a SPICE netlist (a text list of the circuit's parts and how they
  connect) from the schematic or from the finished chip layout, simulates it here for
  reference-quality results, and sends the waveforms back to the circuit designers.
