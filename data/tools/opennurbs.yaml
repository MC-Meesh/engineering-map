website: https://www.rhino3d.com/opennurbs/
summary: Free toolkit for reading and writing 3DM files and evaluating NURBS; not a full modeling kernel.
plain: >-
  A free toolkit for reading and writing Rhino's 3DM files and working with smooth curves and
  surfaces (NURBS); it is not a full modeling engine.
workflow: >-
  Developers build openNURBS into their programs so they can read and write Rhino 3DM files and
  evaluate the curves and surfaces inside them.
notes: >-
  A C++ source toolkit for reading and writing 3DM files, offered so other CAD, CAM and CAE
  developers can exchange geometry with Rhino; McNeel says it is not a full geometry library.
