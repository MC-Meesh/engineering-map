id: modelcenter
type: tool
name: Ansys ModelCenter
category: systems-mbse
vendor: ansys
origin: phoenix-integration
open_source: false
status: active
first_release: 1997
stages:
  - requirements
  - optimization
integrates_with:
  - cameo
website: https://www.ansys.com/products/connect/ansys-modelcenter
summary: Connects SysML architecture models to analysis tools for trade studies.
plain: >-
  Connects diagrams of a whole system's design, written in the SysML modeling language, to analysis
  tools, so engineers can run studies that compare design options.
workflow: >-
  Systems engineers link their SysML model in Cameo to analysis tools here, run trade studies across
  the design options, and return the results to the architecture model.
native_files:
