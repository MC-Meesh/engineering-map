summary: >-
  Ghent developer of BricsCAD, a DWG-native CAD platform. Bought by Hexagon in 2018, moved to Octave
  in the 2026 spin-off; the Bricsys brand is being retired for Octave BricsCAD while Bricsys NV
  remains the legal entity.
notes: >-
  In October 2011 Menhirs NV, parent of Bricsys, acquired the source code and IP of LEDAS's LGS 2D,
  LGS 3D, Driving Dimensions and RhinoWorks.
